# 三电荷道 config, 无 trans 约束（trans_multi.yml 的对照组, 宿主端即可校验）
#
# 结构: J/ψ → η + R, R 经三种电荷道衰变: ω 型 π⁰ρ⁰ / π⁺ρ⁻ / π⁻ρ⁺。
# R 有两个共振态 → 每种电荷道 2 个链组合 = 6 个链耦合;
# 无约束时三种电荷道各自独立 → 6 个链耦合（trans_multi.yml 中应只剩 2 个）。
Particles:
  Jpsi:
    J: 1
    P: -1
    mass: 3.0969
    tex: ['J/\\psi']
  eta:
    J: 0
    P: -1
    mass: 0.5478
    tex: ['\eta']
  pi0:
    J: 0
    P: -1
    mass: 0.1350
    tex: ['\pi^{0}']
  pip:
    J: 0
    P: -1
    mass: 0.1396
    tex: ['\pi^{+}']
  pim:
    J: 0
    P: -1
    mass: 0.1396
    tex: ['\pi^{-}']

Data:
  order: [pip, pim, pi0, eta]
  data: [dat, "./data/test_data.dat"]
  phsp: [dat, "./data/test_phsp.dat"]

DecayChains:
  decay1:
    Jpsi:
      - [eta, R]
    R:
      - [pi0, rho0]
      - [pip, rhom]
      - [pim, rhop]
    rho0: [pip, pim]
    rhop: [pip, pi0]
    rhom: [pim, pi0]

    intermediates:
      R:
        - [J: 1, P: -1]: [phi1020, phi1680]
      rho0:
        - [J: 1, P: -1]: [rho_a]
      rhop:
        - [J: 1, P: -1]: [rho_b]
      rhom:
        - [J: 1, P: -1]: [rho_b]

    legends:
      - ['R', ' → ', 'eta']

# 无 Constraints 段 — 与 trans_multi.yml 形成对比

Resonances:
  phi1020:
    J: 1
    P: -1
    model: BWR
    parameters: [1.0195, 0.0045]
    tex: ["\\phi(1020)"]

  phi1680:
    J: 1
    P: -1
    model: BWR
    parameters: [1.66, 0.125]
    tex: ["\\phi(1680)"]

  # 两个不同的 ρ 定义: 模拟"π⁰ρ⁰ 与 π±ρ∓ 用了不同共振态"的写法,
  # 检验按组合次序配对（不同共振态定义时仍能折叠）
  rho_a:
    J: 1
    P: -1
    model: BWR
    parameters: [0.775, 0.149]
    tex: ["\\rho(770)", "^{0}"]

  rho_b:
    J: 1
    P: -1
    model: BWR
    parameters: [0.775, 0.149]
    tex: ["\\rho(770)", "^{\\pm}"]
